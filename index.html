<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학사일정 캘린더</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --text-muted: #8a8f9a;
    --accent: #4f6df5;
    --today-ring: #ff5a5f;
    --sunday: #e0555f;
    --saturday: #3b6fd6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .page-layout {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
    width: 100%;
    max-width: 1300px;
  }

  .calendar-app {
    width: 100%;
    max-width: 1300px;
    position: relative;
  }

  .quick-menu-wrap {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    align-items: stretch;
  }

  .quick-menu-toggle {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 0 12px 12px 0;
    padding: 16px 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    box-shadow: 3px 0 10px rgba(0, 0, 0, 0.15);
  }

  .quick-menu-arrow {
    font-size: 15px;
    display: inline-block;
    transition: transform 0.25s ease;
  }

  .quick-menu-wrap.open .quick-menu-arrow {
    transform: rotate(180deg);
  }

  .quick-menu-panel {
    width: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: none;
    border-top-right-radius: 16px;
    border-bottom-right-radius: 16px;
    box-shadow: 3px 0 10px rgba(0, 0, 0, 0.08);
    transition: width 0.25s ease;
  }

  .quick-menu-wrap.open .quick-menu-panel {
    width: 190px;
  }

  .quick-menu-list {
    list-style: none;
    margin: 0;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 190px;
  }

  .quick-menu-list a {
    display: block;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f5f6f8;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    transition: background 0.15s ease;
  }

  .quick-menu-list a:hover {
    background: #eef0f4;
  }

  .board-link-tab {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px 0 0 12px;
    padding: 16px 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    box-shadow: -3px 0 10px rgba(0, 0, 0, 0.15);
    text-decoration: none;
  }

  .board-link-arrow {
    font-size: 15px;
  }

  .notice-board {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }

  .notice-logo-row {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }

  .notice-logo-row img {
    height: 44px;
    width: auto;
  }

  .notice-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .notice-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--border);
  }

  .notice-item:last-child {
    border-bottom: none;
  }

  .notice-item .notice-title {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    min-width: 0;
  }

  .notice-item .notice-title:hover {
    text-decoration: underline;
  }

  .notice-item .notice-date {
    font-size: 11px;
    color: var(--text-muted);
    flex: none;
  }

  .notice-more {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-decoration: none;
    border-top: 1px solid var(--border);
  }

  .notice-more:hover {
    color: var(--accent);
  }

  .shortcut-board {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }

  .shortcut-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }

  .shortcut-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .shortcut-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 64px;
    padding: 10px 12px;
    border-radius: 12px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    text-decoration: none;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .shortcut-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .shortcut-btn.row-1 { background: #7ba8ff; }
  .shortcut-btn.row-2 { background: #4f6df5; }
  .shortcut-btn.row-3 { background: #2f47c9; }

  @media (max-width: 700px) {
    .shortcut-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .my-board {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }

  .my-board-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }

  .my-board-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .my-board-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .my-board-item:last-child {
    border-bottom: none;
  }

  .my-board-item:hover .my-board-item-title {
    text-decoration: underline;
  }

  .my-board-item-title {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .board-closed-badge {
    color: var(--sunday);
    font-weight: 700;
  }

  .my-board-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 16px 0;
  }

  .board-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .board-overlay.open {
    display: flex;
  }

  .board-modal {
    position: relative;
    width: 100%;
    max-width: 460px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    padding: 28px 24px 24px;
  }

  .board-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .board-modal-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    padding-right: 20px;
  }

  .board-modal-content {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .board-list-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .board-list-overlay.open {
    display: flex;
  }

  .board-list-modal {
    position: relative;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    padding: 28px 24px 24px;
  }

  .board-list-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .board-list-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    padding-right: 20px;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .month-nav button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .month-nav button:hover {
    background: #eef0f4;
  }

  .month-title {
    font-size: 22px;
    font-weight: 700;
    min-width: 140px;
    text-align: center;
  }

  .month-logo {
    height: 26px;
    width: auto;
    margin-left: 6px;
  }

  .board-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    flex: none;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .board-btn:hover {
    filter: brightness(1.08);
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .header-actions button {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .header-actions #taskBtn {
    background: #eceef1;
    padding-left: 21px;
    padding-right: 21px;
    font-size: 26px;
  }

  .header-actions #todayBtn {
    padding: 8px 28px;
    border-radius: 20px;
    font-size: 26px;
    font-weight: 700;
  }

  .header-actions button:hover {
    background: #eef0f4;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    min-height: 20px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid transparent;
    background: transparent;
    transition: background 0.15s ease, opacity 0.15s ease;
    user-select: none;
  }

  .legend-item:hover {
    background: #eef0f4;
  }

  .legend-item.active {
    background: var(--panel);
    border-color: var(--border);
    font-weight: 700;
    color: var(--text);
  }

  .legend.filtering .legend-item:not(.active):not(.legend-all) {
    opacity: 0.45;
  }

  .legend-all {
    font-weight: 600;
  }

  .legend.filtering .legend-all {
    color: var(--accent);
    text-decoration: underline;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .calendar-grid {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
  }

  .calendar-grid:active {
    cursor: grabbing;
  }

  .calendar-table {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: auto minmax(128px, auto);
  }

  .weekday-cell {
    text-align: center;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }

  .weekday-cell.sun { color: var(--sunday); }
  .weekday-cell.sat { color: var(--saturday); }

  .day-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    overflow: hidden;
  }

  .day-cell.col-last {
    border-right: none;
  }

  .day-cell.outside {
    background: #fafbfc;
  }

  .day-cell.outside .day-number {
    color: #c9cdd6;
  }

  .day-number {
    font-size: 13px;
    font-weight: 600;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }

  .day-cell.sun .day-number { color: var(--sunday); }
  .day-cell.sat .day-number { color: var(--saturday); }

  .day-cell.today .day-number {
    background: var(--today-ring);
    color: #fff;
  }

  .events {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }

  .event-chip {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--accent);
    cursor: pointer;
  }

  .memo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 110;
    padding: 20px;
  }

  .memo-overlay.open {
    display: flex;
  }

  .memo-note {
    position: relative;
    width: 100%;
    max-width: 320px;
    background: #fffbd6;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      #f1e9a8 28px
    );
    border-radius: 3px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    padding: 26px 22px 22px;
    transform: rotate(-1deg);
  }

  .memo-note::before {
    content: "";
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e0555f;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
  }

  .memo-close {
    position: absolute;
    top: 8px;
    right: 10px;
    border: none;
    background: none;
    font-size: 15px;
    color: #93926a;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .memo-institute {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #756f2c;
    margin-bottom: 10px;
  }

  .memo-institute-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }

  .memo-batch {
    font-size: 13px;
    font-weight: 700;
    color: #55521f;
    margin-bottom: 2px;
  }

  .memo-category {
    font-size: 20px;
    font-weight: 700;
    color: #2c2a10;
    margin-bottom: 18px;
  }

  .memo-period-label {
    font-size: 11px;
    font-weight: 600;
    color: #9a935a;
    margin-bottom: 4px;
  }

  .memo-period-value {
    font-size: 15px;
    font-weight: 700;
    color: #33301a;
    line-height: 1.5;
  }

  @media (max-width: 700px) {
    .calendar-table { grid-auto-rows: auto minmax(70px, auto); }
    .day-number { font-size: 11px; width: 20px; height: 20px; }
    .month-title { font-size: 18px; min-width: auto; }
    .event-chip { font-size: 9px; }
    .month-logo { height: 18px; }

    .header-actions {
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .board-btn,
    .header-actions button {
      font-size: 12px;
      padding: 6px 10px;
    }

    .header-actions #taskBtn {
      font-size: 16px;
      padding-left: 14px;
      padding-right: 14px;
    }

    .header-actions #todayBtn {
      font-size: 16px;
      padding: 6px 16px;
    }
  }

  .today-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .today-overlay.open {
    display: flex;
  }

  .today-modal {
    position: relative;
    width: 100%;
    max-width: 460px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    padding: 28px 24px 24px;
  }

  .today-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .today-modal-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    padding-right: 20px;
  }

  .today-modal-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .today-modal-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .today-modal-item:hover {
    background: #f5f6f8;
  }

  .today-modal-item-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .today-modal-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }

  .today-modal-category {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .today-modal-period {
    font-size: 12px;
    color: var(--text-muted);
  }

  .today-modal-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 30px 0;
  }

  .task-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .task-overlay.open {
    display: flex;
  }

  .task-modal {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    padding: 28px 24px 24px;
  }

  .task-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .task-modal-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
    padding-right: 20px;
  }

  .task-modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .task-modal-box {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    padding: 12px;
    line-height: 1.4;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .task-modal-box:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .task-modal-box.kakao {
    background: #fee500;
    color: #3c1e1e;
  }

  .task-modal-box.drive {
    background: #34a853;
  }
</style>
</head>
<body>
  <div class="page-layout">
  <div class="calendar-app">
    <div class="quick-menu-wrap" id="quickMenuWrap">
      <button class="quick-menu-toggle" id="quickMenuToggle" aria-label="퀵메뉴 열기/닫기">

  function renderCalendar() {
    const year = state.current.getFullYear();
    const month = state.current.getMonth();

    monthTitleEl.textContent = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

    const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

    calendarTableEl.innerHTML = "";
    renderWeekdayRow();

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement("div");
      const col = i % 7;
      let dayNum, cellYear = year, cellMonth = month, outside = false;

      if (i < startWeekday) {
        dayNum = daysInPrevMonth - startWeekday + i + 1;
        cellMonth = month - 1;
        outside = true;
      } else if (i >= startWeekday + daysInMonth) {
        dayNum = i - startWeekday - daysInMonth + 1;
        cellMonth = month + 1;
        outside = true;
      } else {
        dayNum = i - startWeekday + 1;
      }

      if (cellMonth < 0) { cellMonth = 11; cellYear -= 1; }
      if (cellMonth > 11) { cellMonth = 0; cellYear += 1; }

      cell.className = "day-cell" + (outside ? " outside" : "") + (col === 0 ? " sun" : col === 6 ? " sat" : "") + (col === 6 ? " col-last" : "");

      if (!outside && isCurrentMonth && dayNum === today.getDate()) {
        cell.classList.add("today");
      }

      const numberEl = document.createElement("div");
      numberEl.className = "day-number";
      numberEl.textContent = dayNum;
      cell.appendChild(numberEl);

      const eventsWrap = document.createElement("div");
      eventsWrap.className = "events";
      const dateKey = formatDateKey(cellYear, cellMonth, dayNum);
      events
        .filter(ev => ev.date === dateKey)
        .filter(ev => !state.activeInstitute || ev.institute === state.activeInstitute)
        .forEach(ev => {
          const chip = document.createElement("div");
          chip.className = "event-chip";
          chip.style.background = ev.color;
          chip.innerHTML = ev.html;
          chip.title = `${ev.institute} · ${ev.plain}`;
          chip.addEventListener("click", () => openMemo(ev));
          eventsWrap.appendChild(chip);
        });
      cell.appendChild(eventsWrap);

      calendarTableEl.appendChild(cell);
    }
  }

  function render() {
    renderLegend();
    renderCalendar();
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    state.current.setMonth(state.current.getMonth() - 1);
    render();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    state.current.setMonth(state.current.getMonth() + 1);
    render();
  });

  // 달력을 마우스/터치로 드래그하면 이전/다음 달로 이동
  const calendarGridEl = document.querySelector(".calendar-grid");
  let dragStartX = null;
  let dragStartY = null;

  calendarGridEl.addEventListener("pointerdown", (e) => {
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  });

  calendarGridEl.addEventListener("pointerup", (e) => {
    if (dragStartX === null) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    dragStartX = null;

    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      state.current.setMonth(state.current.getMonth() + (dx < 0 ? 1 : -1));
      render();
    }
  });

  calendarGridEl.addEventListener("pointerleave", () => {
    dragStartX = null;
  });

  document.getElementById("yesterdayBtn").addEventListener("click", () => {
    openDayModal(-1);
  });

  document.getElementById("todayBtn").addEventListener("click", () => {
    state.current = new Date();
    state.current.setDate(1);
    render();
    openDayModal(0);
  });

  document.getElementById("tomorrowBtn").addEventListener("click", () => {
    openDayModal(1);
  });

  render();

      li.appendChild(d);
      listEl.appendChild(li);
    });

    moreEl.href = noticeBoard.moreUrl;
  }
